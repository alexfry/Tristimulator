# Build and test Tristimulator on a GitHub-hosted Apple Silicon runner.
# Signing secrets are not read here. See docs/CI.md.
name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "ThirdPartyNotices/**"
      - ".gitignore"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "ThirdPartyNotices/**"
      - ".gitignore"

# Cancel a run that a newer commit on the same PR or on main has replaced.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_TERMINAL_PROMPT: "0"
  # Standard macos-26 arm64 is 3 cores and 7 GB RAM. A full -j link of
  # OpenImageIO or libjxl can be killed on that machine.
  VCPKG_MAX_CONCURRENCY: "2"

jobs:
  build-and-test:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27.2
        run: Scripts/ci_prepare_runner.sh

      - name: Configure vcpkg binary cache
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.ACTIONS_CACHE_URL || "";
            const token = process.env.ACTIONS_RUNTIME_TOKEN || "";
            if (!url || !token) {
              core.warning("GitHub Actions cache credentials are not visible. vcpkg will compile from source and will not use the binary cache.");
              core.exportVariable("VCPKG_BINARY_SOURCES", "clear");
              return;
            }
            core.exportVariable("ACTIONS_CACHE_URL", url);
            core.exportVariable("ACTIONS_RUNTIME_TOKEN", token);
            const head = context.payload.pull_request && context.payload.pull_request.head;
            const fork = Boolean(head && head.repo && head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`);
            const mode = fork ? "read" : "readwrite";
            core.exportVariable("VCPKG_BINARY_SOURCES", `clear;x-gha,${mode}`);
            core.info(`vcpkg binary cache: x-gha,${mode}`);

      - name: Build third-party libraries
        run: Scripts/build_thirdparty.sh

      - name: Check static libraries against the Xcode link line
        run: Scripts/ci_verify_static_libs.sh

      - name: Report third-party disk use
        run: |
          du -sh "${HOME}/Library/Caches/Tristimulator/ThirdParty/installed" || true
          du -sh "${HOME}/Library/Caches/Tristimulator/ThirdParty/vcpkg" || true

      - name: Test
        run: Scripts/ci_xcode_test.sh

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults
          if-no-files-found: ignore
